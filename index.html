<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>IBADAN LIFE</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#080808;
    --panel:#111;
    --panel2:#181818;
    --border:#292929;
    --text:#fff;
    --muted:#929292;
    --green:#35d07f;
    --yellow:#f5c84b;
    --red:#ff5757;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

button{
    font:inherit;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* ================= LANDING ================= */

#landing{
    position:fixed;
    inset:0;
    z-index:100;
    background:
        radial-gradient(circle at 50% 40%,#292929 0,#0d0d0d 45%,#030303 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.landing-box{
    width:min(520px,100%);
    text-align:center;
}

.logo{
    font-size:clamp(40px,12vw,75px);
    font-weight:950;
    letter-spacing:4px;
}

.logo span{
    color:#777;
}

.tag{
    color:#999;
    margin:12px 0 30px;
    line-height:1.6;
}

.enter{
    width:100%;
    padding:17px;
    border:0;
    border-radius:12px;
    background:#fff;
    color:#000;
    font-weight:800;
    font-size:16px;
}

.enter.secondary{
    background:#171717;
    color:white;
    border:1px solid #333;
    margin-top:10px;
}

/* ================= CREATOR ================= */

#creator{
    position:fixed;
    inset:0;
    z-index:90;
    background:#070707;
    overflow:auto;
    padding:25px 15px;
}

.creator-box{
    width:min(520px,100%);
    margin:auto;
    background:#111;
    border:1px solid #292929;
    border-radius:18px;
    padding:24px;
}

.creator-box h1{
    margin-bottom:7px;
}

.creator-box p{
    color:#888;
    line-height:1.5;
    margin-bottom:22px;
}

label{
    display:block;
    color:#aaa;
    font-size:12px;
    margin:16px 0 7px;
}

input,select{
    width:100%;
    padding:14px;
    border-radius:9px;
    border:1px solid #333;
    background:#080808;
    color:#fff;
    outline:none;
}

.gender{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.gender button{
    padding:14px;
    border-radius:9px;
    background:#0b0b0b;
    color:#fff;
    border:1px solid #333;
}

.gender button.active{
    background:#fff;
    color:#000;
}

.create-btn{
    width:100%;
    margin-top:22px;
    padding:15px;
    border:0;
    border-radius:9px;
    background:#fff;
    color:#000;
    font-weight:800;
}

/* ================= GAME ================= */

#game{
    position:fixed;
    inset:0;
    display:none;
    background:#000;
}

#scene{
    position:absolute;
    inset:0;
}

canvas{
    display:block;
}

/* ================= TOP HUD ================= */

.top-hud{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:20;
    padding:9px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:linear-gradient(#050505dd,#050505aa,transparent);
}

.brand{
    font-weight:900;
    letter-spacing:1px;
}

.world-info{
    font-size:11px;
    color:#bbb;
}

.stats{
    display:flex;
    gap:5px;
}

.stat{
    padding:7px 9px;
    background:#101010dd;
    border:1px solid #292929;
    border-radius:8px;
    font-size:11px;
}

/* ================= NEEDS ================= */

.needs{
    position:absolute;
    top:55px;
    left:10px;
    z-index:20;
    width:145px;
    background:#090909dd;
    border:1px solid #292929;
    border-radius:10px;
    padding:9px;
}

.need{
    margin-bottom:7px;
}

.need:last-child{
    margin-bottom:0;
}

.need-line{
    display:flex;
    justify-content:space-between;
    font-size:9px;
    color:#aaa;
    margin-bottom:3px;
}

.bar{
    height:5px;
    border-radius:5px;
    background:#2a2a2a;
    overflow:hidden;
}

.fill{
    height:100%;
    width:80%;
    background:#fff;
}

/* ================= LOCATION ================= */

.location{
    position:absolute;
    top:58px;
    right:10px;
    z-index:20;
    padding:8px 10px;
    background:#090909dd;
    border:1px solid #292929;
    border-radius:8px;
    font-size:11px;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
    position:absolute;
    z-index:30;
    left:7px;
    right:7px;
    bottom:7px;
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:5px;
    background:#080808e8;
    border:1px solid #292929;
    border-radius:13px;
    padding:5px;
}

.nav-btn{
    border:0;
    background:#141414;
    color:#aaa;
    border-radius:8px;
    padding:9px 2px;
    font-size:10px;
}

.nav-btn strong{
    display:block;
    font-size:17px;
    margin-bottom:2px;
}
