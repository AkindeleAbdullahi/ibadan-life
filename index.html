function createBuilding(x,z,height){

  const width =
    14 + Math.random()*8;

  const depth =
    14 + Math.random()*8;

  const building =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        width,
        height,
        depth
      ),
      new THREE.MeshStandardMaterial({
        color:
          new THREE.Color().setHSL(
            0.07,
            0.18,
            0.28+Math.random()*0.18
          )
      })
    );

  building.position.set(
    x,
    height/2,
    z
  );

  scene.add(building);


  /* ROOF */

  const roof =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        width+1,
        1,
        depth+1
      ),
      new THREE.MeshStandardMaterial({
        color:0x292929
      })
    );

  roof.position.set(
    x,
    height+0.5,
    z
  );

  scene.add(roof);

}


/* -------------------------
   LANDMARK
------------------------- */

function createLandmark(x,z,name){

  const group =
    new THREE.Group();

  const base =
    new THREE.Mesh(
      new THREE.BoxGeometry(22,4,22),
      new THREE.MeshStandardMaterial({
        color:0x202020
      })
    );

  base.position.y=2;

  group.add(base);


  const tower =
    new THREE.Mesh(
      new THREE.BoxGeometry(8,18,8),
      new THREE.MeshStandardMaterial({
        color:0x555555
      })
    );

  tower.position.y=13;

  group.add(tower);


  group.position.set(x,0,z);

  scene.add(group);

}


/* -------------------------
   PLAYER
------------------------- */

function createPlayer(){

  player =
    new THREE.Group();


  const body =
    new THREE.Mesh(
      new THREE.CapsuleGeometry(
        0.8,
        1.7,
        4,
        8
      ),
      new THREE.MeshStandardMaterial({
        color:
          localStorage.getItem("ibadanGender")==="female"
          ? 0x8e44ad
          : 0x202020
      })
    );

  body.position.y=1.5;

  player.add(body);


  const head =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        0.55,
        16,
        16
      ),
      new THREE.MeshStandardMaterial({
        color:0x6b4028
      })
    );

  head.position.y=3.2;

  player.add(head);


  player.position.set(
    0,
    0,
    0
  );


  scene.add(player);

}


/* -------------------------
   MOVEMENT
------------------------- */

function movePlayer(){

  if(!player) return;

  const speed=0.45;

  if(keys.up)
    player.position.z-=speed;

  if(keys.down)
    player.position.z+=speed;

  if(keys.left)
    player.position.x-=speed;

  if(keys.right)
    player.position.x+=speed;


  camera.position.x +=
    (player.position.x-camera.position.x)*0.08;

  camera.position.z +=
    (player.position.z+18-camera.position.z)*0.08;

  camera.lookAt(
    player.position.x,
    1.5,
    player.position.z
  );


  updateLocation();

}


function updateLocation(){

  const x=player.position.x;
  const z=player.position.z;

  let area="Ibadan City";

  if(x<-30 && z<-30)
    area="Bodija";

  else if(x>30 && z<-30)
    area="Mokola";

  else if(x<-30 && z>30)
    area="Dugbe";

  else if(x>30 && z>30)
    area="Ring Road";

  document.getElementById(
    "location"
  ).textContent="📍 "+area;

}


/* -------------------------
   KEYBOARD
------------------------- */

window.addEventListener(
  "keydown",
  e=>{

    if(e.key==="w" || e.key==="ArrowUp")
      keys.up=true;

    if(e.key==="s" || e.key==="ArrowDown")
      keys.down=true;

    if(e.key==="a" || e.key==="ArrowLeft")
      keys.left=true;

    if(e.key==="d" || e.key==="ArrowRight")
      keys.right=true;

  }
);


window.addEventListener(
  "keyup",
  e=>{

    if(e.key==="w" || e.key==="ArrowUp")
      keys.up=false;

    if(e.key==="s" || e.key==="ArrowDown")
      keys.down=false;

    if(e.key==="a" || e.key==="ArrowLeft")
      keys.left=false;

    if(e.key==="d" || e.key==="ArrowRight")
      keys.right=false;

  }
);


/* -------------------------
   MOBILE CONTROLS
------------------------- */

document
.querySelectorAll(".control")
.forEach(button=>{

  const direction =
    button.dataset.key;

  button.addEventListener(
    "touchstart",
    e=>{
      e.preventDefault();
      keys[direction]=true;
    },
    {passive:false}
  );

  button.addEventListener(
    "touchend",
    e=>{
      e.preventDefault();
      keys[direction]=false;
    },
    {passive:false}
  );

});


/* -------------------------
   GAME LOOP
------------------------- */

function animate(){

  requestAnimationFrame(animate);

  movePlayer();

  renderer.render(
    scene,
    camera
  );

}


function resize(){

  if(!camera || !renderer)
    return;

  camera.aspect =
    window.innerWidth/
    window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

}


window.showMessage=function(message){

  alert(message);

};

</script>
